# engine: postgres        # postgres (default) or mysql
backup_path: backups/latest.dump
postgres_image: postgres:16
min_tables: 2
max_restore_seconds: 600

queries:
  - name: users exist
    sql: SELECT count(*) FROM users
    min: 3
  - name: orders exist
    sql: SELECT count(*) FROM orders
    min: 1

notify:
  slack_webhook: ""      # optional: https://hooks.slack.com/services/...
  discord_webhook: ""    # optional: https://discord.com/api/webhooks/...

# Optional: take a fresh backup before verifying (use ONE of backup_source or s3)
# backup_source: "postgres://user:password@host:5432/dbname"
# MySQL: engine: mysql, image: mysql:8, backup_source: "mysql://user:password@host:3306/dbname"

# Optional: download the backup from S3 (or S3-compatible storage) before verifying
# s3:
#   bucket: my-bucket
#   key: backups/latest.dump
#   region: us-east-1
#   endpoint: ""          # only for S3-compatible services
#   access_key: ""        # leave empty to use AWS_ACCESS_KEY_ID from the environment
#   secret_key: ""        # leave empty to use AWS_SECRET_ACCESS_KEY from the environment